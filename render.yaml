services:
  - type: web
    name: vedaai-api
    runtime: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vedaai-cache
          property: connectionString
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen2.5-72B-Instruct

  - type: keyvalue
    name: vedaai-cache
    plan: free
    ipAllowList: []
